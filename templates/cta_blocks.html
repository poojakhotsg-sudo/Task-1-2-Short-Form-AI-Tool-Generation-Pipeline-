<!--
  Reusable CTA partials for lead magnets. pipeline/reel_kit.py cuts this file into the blocks
  between "partial: NAME" and "/partial" comments, and templates/lead_magnet.html pulls each one in
  with a partial:NAME placeholder. Link and text placeholders are filled from config/links.json
  (an empty or non-http link becomes "#"). After editing links.json, re-render existing lead magnets with:
      python -m pipeline.reel_kit --rerender out/<tool folder>
-->

<!-- partial: cta_styles -->
<style>
  .ctab-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 26px 0 0; }
  .ctab-btn { display: inline-block; padding: 12px 20px; border-radius: 8px; font: 600 15px/1.2 Helvetica, Arial, sans-serif;
              text-decoration: none; border: 2px solid #1d1b16; }
  .ctab-primary { background: #8a5a00; border-color: #8a5a00; color: #fffdf8; }
  .ctab-secondary { background: transparent; color: #1d1b16; }
  .ctab-help { margin-top: 38px; padding-top: 24px; border-top: 1px solid #e2dccd; break-inside: avoid; }
  .ctab-help-title { font-size: 22px; margin: 0 0 14px; }
  .ctab-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .ctab-card { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: 1px solid #e2dccd; border-radius: 8px;
               background: #f8f4ea; color: #1d1b16; text-decoration: none; font: 13px/1.45 Helvetica, Arial, sans-serif; }
  .ctab-card strong { font-size: 15px; }
  .ctab-card span { color: #5c574c; }
  .ctab-n { font-weight: 700; color: #8a5a00 !important; }
  @media (max-width: 560px) { .ctab-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
<!-- /partial -->

<!-- partial: course_button -->
<a class="ctab-btn ctab-primary" href="{{COURSE_URL}}">Get the course</a>
<!-- /partial -->

<!-- partial: lead_magnet_button -->
<a class="ctab-btn ctab-secondary" href="{{LEAD_MAGNET_URL}}">Download the lead magnet</a>
<!-- /partial -->

<!-- partial: help_footer -->
<section class="ctab-help">
  <h2 class="ctab-help-title">4 ways I can help you</h2>
  <div class="ctab-grid">
    <a class="ctab-card" href="{{HELP_LINK_1}}"><span class="ctab-n">1</span><strong>{{HELP_LINK_1_TITLE}}</strong><span>{{HELP_LINK_1_TEXT}}</span></a>
    <a class="ctab-card" href="{{HELP_LINK_2}}"><span class="ctab-n">2</span><strong>{{HELP_LINK_2_TITLE}}</strong><span>{{HELP_LINK_2_TEXT}}</span></a>
    <a class="ctab-card" href="{{HELP_LINK_3}}"><span class="ctab-n">3</span><strong>{{HELP_LINK_3_TITLE}}</strong><span>{{HELP_LINK_3_TEXT}}</span></a>
    <a class="ctab-card" href="{{HELP_LINK_4}}"><span class="ctab-n">4</span><strong>{{HELP_LINK_4_TITLE}}</strong><span>{{HELP_LINK_4_TEXT}}</span></a>
  </div>
</section>
<!-- /partial -->
